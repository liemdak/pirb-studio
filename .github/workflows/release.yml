name: Test and build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libpulse0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, 'app')
          from version import VERSION
          assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/build_windows.py
      - run: python tools/verify_package.py
      - run: python tools/smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Pirb-Desk-Windows-x64
          path: dist/*
      - name: Publish versioned preview
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = python -c "import sys; sys.path.insert(0, 'app'); from version import VERSION; print('v' + VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $current = gh release view $tag --repo $repo --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $current | ConvertFrom-Json
            if (-not $release.isDraft -and $release.assets.Count -gt 0) {
              foreach ($file in Get-ChildItem dist -File) {
                if ($release.assets.name -notcontains $file.Name) { throw "Published release is incomplete: $($file.Name)" }
              }
              Write-Host "Preserving the already published release assets."
              exit 0
            }
            gh release edit $tag --repo $repo --draft
          } else {
            gh release create $tag --repo $repo --target $env:GITHUB_SHA --draft --title "Pirb Desk $tag" --notes-file CHANGELOG.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag dist/* --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $repo --draft=false --prerelease --title "Pirb Desk $tag" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Test and build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libpulse0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, 'app')
          from version import VERSION
          assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/build_windows.py
      - run: python tools/verify_package.py
      - run: python tools/smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: PIRB-Studio-Windows-x64
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/* --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/* --repo $env:GITHUB_REPOSITORY --verify-tag --title "PIRB Studio $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
